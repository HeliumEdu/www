site:
  name: Helium
  site: 'https://landing.heliumedu.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: 'Helium - The student planner that lightens your course load'
    template: '%s - Helium'
  description: 'Free, open-source student planner. Calendar, classes, grades, todos, and notebook - across every device. Built for students, by students.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Helium
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 0

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
