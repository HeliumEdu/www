site:
  name: Helium
  site: 'https://www.heliumedu.com'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: 'Helium - Student Planner & Academic Calendar App'
    template: '%s | Helium'
  description: 'Helium is a smart student planner that organizes your classes, assignments, grades, and notes into one color-coordinated calendar for academic success.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Helium
    images:
      - url: '~/assets/images/og-default.png'
        width: 1200
        height: 630
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false

    post:
      isEnabled: false
      permalink: '/%slug%'
      robots:
        index: false

    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false

    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false

    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: false
    relatedPostsCount: 0

analytics:
  vendors:
    googleAnalytics:
      id: G-S032FE2183

ui:
  theme: 'system'
