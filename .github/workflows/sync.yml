name: "Sync"

run-name: "Sync"

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: helium-www-sync

jobs:
  sync:
    name: Sync

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.HELIUM_BOT_APP_ID }}
          private-key: ${{ secrets.HELIUM_BOT_PRIVATE_KEY }}
          skip-token-revoke: true

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install ImageMagick 7
        run: |
          release=$(curl -fsSL https://api.github.com/repos/ImageMagick/ImageMagick/releases/latest)
          tag=$(echo "$release" | jq -r '.tag_name')
          url=$(echo "$release" | jq -r '.assets[] | select(.name | test("gcc-x86_64.AppImage$")) | .browser_download_url')
          wget -q "$url" -O /tmp/magick.AppImage
          chmod +x /tmp/magick.AppImage
          cd /tmp && ./magick.AppImage --appimage-extract > /dev/null
          sudo mv /tmp/squashfs-root /opt/imagemagick
          sudo ln -sf /opt/imagemagick/usr/bin/magick /usr/local/bin/magick
          magick -version

      - name: Regenerate OG image
        run: npm run build-og-image

      - name: Get GitHub App bot user ID
        id: get-bot-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config --global user.email "${{ steps.get-bot-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A src/assets/img/og-default.png
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Regenerate OG image"
            git push
          fi
