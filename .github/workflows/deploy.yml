name: "Deploy"

run-name: "Deploy"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "helium-www-deploy"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        env:
          BUCKET_NAME: heliumedu.www.static
        run: |
          echo "Deploying to s3://${BUCKET_NAME} ..."

          # Long-lived cache for hashed Astro assets
          aws s3 sync ./dist "s3://${BUCKET_NAME}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --exclude "*.json" \
            --exclude "robots.txt" \
            --exclude "sitemap*"

          # No-cache for HTML and indexes
          find ./dist -name "*.html" -exec sh -c 'RELPATH="${1#./dist/}"; aws s3 cp "$1" "s3://'"${BUCKET_NAME}"'/${RELPATH}" --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8"' _ {} \;

          # Short cache for sitemaps, robots, JSON
          find ./dist \( -name "*.xml" -o -name "robots.txt" -o -name "*.json" \) -exec sh -c 'RELPATH="${1#./dist/}"; aws s3 cp "$1" "s3://'"${BUCKET_NAME}"'/${RELPATH}" --cache-control "public, max-age=300"' _ {} \;

          echo "Deployment complete."

      - name: Invalidate CloudFront cache
        env:
          DOMAIN: landing.heliumedu.com
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(not_null(Aliases.Items, \`[]\`), '${DOMAIN}')].Id" \
            --output text)

          if [ -n "$DISTRIBUTION_ID" ] && [ "$DISTRIBUTION_ID" != "None" ]; then
            echo "Invalidating CloudFront distribution ${DISTRIBUTION_ID} for ${DOMAIN} ..."
            aws cloudfront create-invalidation \
              --distribution-id "$DISTRIBUTION_ID" \
              --paths "/*"
          else
            echo "Warning: Could not find CloudFront distribution for ${DOMAIN}"
          fi

      - name: Deployment summary
        run: |
          echo "### Marketing site deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://landing.heliumedu.com" >> $GITHUB_STEP_SUMMARY
